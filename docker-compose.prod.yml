version: '3.9'

# Shared defaults for Node services
x-api: &api-base
  build: .
  image: ghcr.io/hamarigo/grocery-marketplace/api:latest
  env_file: .env.prod
  restart: always

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_DB:       bakala
      POSTGRES_USER:     ${POSTGRES_USER:-bakala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-bakala}"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      retries: 10
    env_file: .env.prod
    mem_limit: 320m
    mem_reservation: 128m

  elasticsearch:
    image: elasticsearch:8.13.4
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      retries: 15
    # Heap is capped at 256m above, but ES's off-heap/Lucene overhead needs
    # real headroom on top of that — this is the single biggest container here.
    mem_limit: 768m
    mem_reservation: 512m

  # ── DB migration (runs once, exits 0 on success) ────────────────────────────

  migrate:
    <<: *api-base
    command: npx tsx src/db/migrate.ts
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    <<: *api-base
    command: npx tsx src/main.ts
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      migrate:       { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      retries: 5
    mem_limit: 350m
    mem_reservation: 200m

  notifications-svc:
    <<: *api-base
    command: npx tsx src/services/notifications/index.ts
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 200m

  tracking-svc:
    <<: *api-base
    command: npx tsx src/services/tracking/index.ts
    environment:
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 200m

  discovery-svc:
    <<: *api-base
    command: npx tsx src/services/discovery/index.ts
    environment:
      NODE_ENV: production
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    mem_limit: 300m
    mem_reservation: 150m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    image: ghcr.io/hamarigo/grocery-marketplace/frontend:latest
    restart: always
    ports:
      - '80:80'
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
  esdata:
